<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutor Listings</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='testingweb.css') }}">
</head>
<body>
  <header>
    <h1>Tutor Listings</h1>
    <div class="filters">
      <input type="search" id="searchInput" placeholder="Search tutors…" aria-label="Search tutors">
      <select id="priceSelect" aria-label="Filter by price">
        <option value="">All Prices</option>
        <option value="low">Under RM20</option>
        <option value="mid">RM20–RM50</option>
        <option value="high">Above RM50</option>
      </select>
      <select id="subjectSelect" aria-label="Filter by subject">
        <option value="">All Subjects</option>
        <option value="english">English</option>
        <option value="math">Math</option>
        <option value="science">Science</option>
      </select>


      <select id="timeSelect" aria-label="Filter by available time">
        <option value="">Any Time</option>
        <option value="morning">Morning</option>
        <option value="afternoon">Afternoon</option>
        <option value="evening">Evening</option>
      </select>
      <button id="resetButton">Reset Filters</button>
    </div>
  </header>

  <main id="tutorContainer">
  {% for tutor in tutors %}
  <div class="card" 
       data-price="{{ 'low' if tutor.price < 20 else 'mid' if tutor.price <= 50 else 'high' }}"
       data-subject="{{ tutor.subject }}" 
       data-time="{{ tutor.time }}">
    <img src="{{ tutor.img }}" alt="Photo of {{ tutor.name }}">
    <div class="info">
      <h3>{{ tutor.name }}</h3>
      <p class="rating">
        <a href="{{ url_for('reviews') }}?name={{ tutor.name|urlencode }}">★ {{ tutor.rating }}</a>
      </p>
      <p>Category: {{ tutor.category }}</p>
      <p>Subject: {{ tutor.subject.capitalize() }}</p>
      <p>Description: {{ tutor.description }}</p>
      <p>Available: {{ tutor.time.capitalize() }}</p>
      <p><em>{{ tutor.intro }}</em></p>
      <div class="buttons">
        <button>Book trial lesson</button>
        <button>Send message</button>
      </div>
    </div>
  </div>
  {% endfor %}
</main>
  <script>
    const searchInput = document.getElementById('searchInput');
    const priceSelect = document.getElementById('priceSelect');
    const subjectSelect = document.getElementById('subjectSelect');
    const timeSelect = document.getElementById('timeSelect');
    const tutorCards = document.querySelectorAll('#tutorContainer .card');
    const resetButton = document.getElementById('resetButton');

    resetButton.addEventListener('click', () => {
      searchInput.value = '';
      priceSelect.value = '';
      subjectSelect.value = '';
      timeSelect.value = '';
      filterTutors();
    });
  
    function filterTutors() {
      const searchValue = searchInput.value.toLowerCase();
      const priceValue = priceSelect.value;
      const subjectValue = subjectSelect.value;
      const timeValue = timeSelect.value;
  
      tutorCards.forEach(card => {
        const name = card.querySelector('h3').textContent.toLowerCase();
        const price = card.getAttribute('data-price');
        const subject = card.getAttribute('data-subject');
        const time = card.getAttribute('data-time');
  
        const matchesSearch = name.includes(searchValue);
        const matchesPrice = !priceValue || price === priceValue;
        const matchesSubject = !subjectValue || subject === subjectValue;
        const matchesTime = !timeValue || time === timeValue;
  
        if (matchesSearch && matchesPrice && matchesSubject && matchesTime) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  
    searchInput.addEventListener('input', filterTutors);
    priceSelect.addEventListener('change', filterTutors);
    subjectSelect.addEventListener('change', filterTutors);
    timeSelect.addEventListener('change', filterTutors);
  </script>
</body>
</html>
