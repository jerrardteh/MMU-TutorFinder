<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutor Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background-color: #f4f4f4;
            padding: 15px;
            border-right: 2px solid #ccc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        .student-name {
            cursor: pointer;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.3s ease;
        }

        .student-name:hover {
            background-color: #e0e0e0;
        }

        /* Main Content Panel */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 20px;
            background-color: #fff;
            overflow-y: auto;
        }

        .chat-panel {
            flex-grow: 1;
            padding: 20px;
            height: 70vh;
            overflow-y: auto;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message {
            margin-bottom: 10px;
        }

        .sender {
            font-weight: bold;
        }

        /* Button Container */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.2s ease-in-out;
            text-decoration: none;
        }

        .action-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .action-btn:active {
            background-color: #397d3a;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
            }

            .main-content {
                padding: 10px;
            }

            .button-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3>Student List</h3>
    {% for lesson in lessons %}
        <div class="student-name" onclick="openChat('{{ lesson.studentname }}')">
            {{ lesson.studentname }}<br>
            <small>{{ lesson.time }}</small>
        </div>
    {% endfor %}
</div>

<!-- Main Content Area -->
<div class="main-content">

    <!-- Button Container (Navigation Bar) -->
    <div class="button-container">
        <a href="{{ url_for('addtime.html') }}">
            <button class="action-btn">Add Time</button>
        </a>
        <a href="{{ url_for('tutorview.tutortimetable') }}">
            <button class="action-btn">Timetable</button>
        </a>
        <a href="{{ url_for('tutorview.acceptlesson') }}">
            <button class="action-btn">Accept Lessons</button>
        </a>
        <a href="http://localhost:5000/login/">
            <button class="action-btn">Back to Login</button>
        </a>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel" id="chat-panel">
        <h3>Select a student to start chatting</h3>
    </div>
</div>

<script>
    const lessons = {{ lessons | tojson }};
    function getUrlParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }

    const selectedStudent = getUrlParam('selected_student');

    function openChat(studentname) {
        const lesson = lessons.find(l => l.studentname === studentname);
        if (!lesson) return;

        let chatHTML = `<h3>Chat with ${lesson.studentname}</h3>`;
        chatHTML += `<div><strong>Lesson Time:</strong> ${lesson.time || 'No lesson'}</div><hr>`;

        if (lesson.messages.length > 0) {
            lesson.messages.forEach(msg => {
                chatHTML += `<div class="message"><span class="sender">${msg.sender}</span> to <span class="receiver">${msg.receiver}</span>: `;
                if (msg.type === 'image') {
                    chatHTML += `<img src="/static/${msg.content}" alt="Image" style="max-width: 200px;">`;
                } else if (msg.type === 'video') {
                    chatHTML += `<video controls width="300"><source src="/static/${msg.content}" type="video/mp4"></video>`;
                } else if (msg.type === 'file') {
                    chatHTML += `<a href="/static/${msg.content}" download>${msg.content.split('/').pop()}</a>`;
                } else {
                    chatHTML += msg.content;
                }
                chatHTML += ` <small>(${msg.timestamp})</small></div>`;
            });
        } else {
            chatHTML += `<p>No messages yet.</p>`;
        }

        chatHTML += `
            <hr>
            <form method="POST" enctype="multipart/form-data" action="{{ url_for('tutorview.send_message') }}">
                <input type="hidden" name="studentname" value="${lesson.studentname}">
                <input type="text" name="message" placeholder="Type a message..." required>
                <input type="file" name="image" accept="image/*">
                <input type="file" name="file">
                <input type="file" name="video" accept="video/*">
                <button type="submit">Send</button>
            </form>
        `;

        document.getElementById('chat-panel').innerHTML = chatHTML;
    }

    if (selectedStudent) {
        openChat(selectedStudent);
    }
</script>

</body>
</html>
