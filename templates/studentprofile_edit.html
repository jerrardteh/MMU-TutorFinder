<!DOCTYPE html>
<html>
<head>
    <title>Edit Student Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
            color: #444;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px 10px;
            font-size: 1em;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1em;
            background-color: teal;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005f5f;
        }
        ul.flash-messages {
            list-style-type: none;
            padding: 0;
            margin-bottom: 15px;
        }
        ul.flash-messages li {
            margin-bottom: 10px;
            font-weight: bold;
        }
        ul.flash-messages li.success {
            color: teal;
        }
        ul.flash-messages li.error {
            color: red;
        }
        a.back-link {
            display: inline-block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }
        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Edit Profile</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-messages">
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('studentprofile.edit_student_profile') }}">
        <label for="full_name">Full Name</label>
        <input type="text" name="full_name" id="full_name" value="{{ user.full_name }}" required>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" value="{{ user.email }}" required>

        <label for="mmuid">MMU ID</label>
        <input type="text" name="mmuid" id="mmuid" value="{{ user.mmuid }}" required>

        <button type="submit">Update Profile</button>
    </form>

    <a href="{{ url_for('studentprofile.student_profile') }}" class="back-link">Back to Profile</a>
</body>
</html>
