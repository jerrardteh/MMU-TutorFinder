<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Time</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='addtime.css') }}" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            overflow-x: auto;
        }

        h1 {
            color: #000000;
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            text-align: left;
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
            box-sizing: border-box;
        }

        select:focus, button:focus {
            outline: none;
            border-color: #2c3e50;
        }

        button {
            background-color: #2c3e50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2c3e50;
        }

        .flash-messages {
            margin-top: 20px;
            padding: 10px;
            background-color: #ffdddd;
            color: #d8000c;
            border: 1px solid #d8000c;
            border-radius: 5px;
            display: none; /* Hidden by default, can be shown with JavaScript */
        }

        .flash-messages ul {
            list-style: none;
            padding: 0;
        }

        .flash-messages li {
            margin: 5px 0;
        }

        /* Timetable styling for existing times */
        table.timetable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        table.timetable th, table.timetable td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        table.timetable th {
            background-color: #2c3e50;
            color: white;
        }

        table.timetable td {
            background-color: #f9f9f9;
        }

        table.timetable tr:nth-child(even) td {
            background-color: #f1f1f1;
        }

        table.timetable tr:hover td {
            background-color: #f1c40f;
            color: #fff;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Add Time for Tutor</h1>
        
        <form action="/addtime/submit" method="post">
            <ul>
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                            <li style="color:#d8000c;">{{ message }}</li>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </ul>

            <!-- Show existing time as a table -->
            <table class="timetable" aria-label="Existing tutor times">
                <thead>
                    <tr>
                        <th>Day</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    {% for daytime in daytime %}
                    <tr>
                        <td>{{ daytime.day }}</td>
                        <td>{{ daytime.time }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <label for="day">Day</label>
            <select name="day" id="day" required>
                <option value="Sunday">Sunday</option>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
            </select>

            <label for="time">Select a Time</label>
            <select name="time" id="time" required>
                {% for hour in range(24) %}
                    <option value="{{ '{:02d}:00'.format(hour) }}">{{ '{:02d}:00'.format(hour) }}</option>
                    <option value="{{ '{:02d}:30'.format(hour) }}">{{ '{:02d}:30'.format(hour) }}</option>
                {% endfor %}
            </select>

            <button type="submit">Submit</button>
        </form>
        <a href="/tutorview/" class="back-btn" style="display: inline-block; margin-top: 15px; text-decoration: none; font-weight: bold;">Back to Tutor View</a>
    </div>
    
</body>
</html>
