<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for MMU TutorFinder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
<body>
    <div class="registration-container">
        <header class="registration-header">
            <h1>Join MMU TutorFinder</h1>
        </header>
        
        <main class="registration-form">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div class="flash-messages">
                    <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                    </ul>
                </div>
                {% endif %}
            {% endwith %}
            
            <form action="/register/register" method="post">
                <div class="form-group">
                    <label for="fname">Full Name</label>
                    <input type="text" name="fullname" id="fname" class="form-control" required placeholder="Enter your full name" value="{{ fullname if fullname else '' }}">
                </div>
                
                <div class="form-group">
                    <label for="user">Username</label>
                    <input type="text" name="username" id="user" class="form-control" required placeholder="Choose a username" value="{{ username if username else '' }}">
                </div>
                
                <div class="form-group">
                    <label for="pass">Password</label>
                    <input type="password" name="password" id="pass" class="form-control" required placeholder="Create a strong password" value="{{ password if password else '' }}">
                </div>
                
                <div class="form-group">
                    <label for="id">Student ID</label>
                    <input type="text" name="mmuid" id="id" class="form-control" required placeholder="Enter your MMU student ID" value="{{ mmuid if mmuid else '' }}">
                </div>
                
                <div class="form-group">
                    <label for="mail">Email</label>
                    <input type="email" name="email" id="mail" class="form-control" required placeholder="your.email@example.com" value="{{ email if email else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Role</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" class="radio-option" id="student" name="role" value="student" {% if role == 'student' %}checked{% endif %} required>
                            <label for="student" class="radio-option">Student</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" class="radio-option" id="tutor" name="role" value="tutor" {% if role =='tutor' %}checked{% endif %} required>
                            <label for="tutor" class="radio-option">Tutor</label>
                        </div>
                    </div>
                </div>

                <div class="form-group price-conditional-input" id="priceInput">
                    <label for="price">Price / Hour (RM)</label>
                    <input type="number" min="1" step=".01" name="price" id="fare" class="form-control" required placeholder="Enter your desired price" value="{{ price if price else '' }}">
                </div>
                
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea name="bio" id="bio" class="form-control" placeholder="Tell us about yourself and your academic background">{{ bio if bio else '' }}</textarea>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subjects</label>
                    <select name="subject">
                        {% for subjects in subjects %}
                        <option value="{{ subjects.code }}" {% if subjects.code == subject %}selected{% endif %}>{{ subjects.semester }} {{subjects.code}} {{subjects.name}}</option>
                        {% endfor %}
                    </select>
                </div>
                

                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Create Account</button>
                    <a href="/login" class="btn btn-secondary">Back to Login</a>
                </div>
            </form>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const studentRadio = document.getElementById('student');
            const tutorRadio = document.getElementById('tutor');
            const priceInputDiv = document.getElementById('priceInput');

            function togglePriceInput() {
                if (tutorRadio.checked) {
                    priceInputDiv.style.display = 'block';
                } else {
                    priceInputDiv.style.display = 'none';
                }
            }

            studentRadio.addEventListener('change', togglePriceInput);
            tutorRadio.addEventListener('change', togglePriceInput);

            togglePriceInput()
        });
    </script>
</body>
</html>
