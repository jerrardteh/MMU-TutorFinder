<!DOCTYPE html>
<html>
<head>
    <title>Edit Tutor Profile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 30px 35px;
            background: #f0f2f5;
            border-radius: 14px;
            box-shadow: 0 0 22px rgba(0,0,0,0.08);
            color: #2c3e50;
        }
        h1 {
            font-weight: 700;
            font-size: 2.2rem;
            color: #34495e;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: 600;
            color: #34495e;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea {
            min-height: 90px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        button {
            margin-top: 25px;
            padding: 14px 28px;
            font-size: 1.2rem;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1c5980;
        }
        ul.flash-messages {
            list-style: none;
            padding: 0;
            margin-bottom: 25px;
        }
        ul.flash-messages li {
            margin-bottom: 12px;
            font-weight: 600;
            border-radius: 6px;
            padding: 10px 14px;
        }
        ul.flash-messages li.success {
            background-color: #d4edda;
            color: #155724;
        }
        ul.flash-messages li.error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2980b9;
            background: #dfe6e9;
            box-shadow: 0 4px 14px rgba(41, 128, 185, 0.4);
            margin-bottom: 15px;
        }
        .file-input {
            margin-top: 8px;
            font-size: 1rem;
            color: #555;
        }
        a.back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2980b9;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.3s;
        }
        a.back-link:hover {
            border-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Edit Profile</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-messages">
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data" action="{{ url_for('tutorprofile.edit_tutor_profile') }}">
        {% if user.profile_picture %}
            <img src="{{ url_for('static', filename='profile_pictures/' ~ user.profile_picture) }}" alt="Avatar" class="avatar-preview" />
        {% else %}
            <img src="{{ url_for('static', filename='default_avatar.png') }}" alt="Default Avatar" class="avatar-preview" />
        {% endif %}

        <label for="profile_picture">Upload Profile Picture</label>
        <input type="file" name="profile_picture" id="profile_picture" class="file-input" accept="image/*">

        <label for="full_name">Full Name</label>
        <input type="text" name="full_name" id="full_name" value="{{ user.full_name }}" required>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" value="{{ user.email }}" required>

        <label for="mmuid">MMU ID</label>
        <input type="text" name="mmuid" id="mmuid" value="{{ user.mmuid }}" required>

        <label for="bio">Bio</label>
        <textarea name="bio" id="bio" placeholder="Write a short bio...">{{ user.bio }}</textarea>

        <label for="subjects">Subjects</label>
        <textarea name="subjects" id="subjects" placeholder="List your subjects, separated by commas...">{{ user.subjects }}</textarea>

        <button type="submit">Update Profile</button>
    </form>

    <a href="{{ url_for('tutorprofile.tutor_profile') }}" class="back-link">← Back to Profile</a>
</body>
</html>
