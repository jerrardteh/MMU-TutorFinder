<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Timetable</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='timetable.css') }}">
</head>
<body>

  <header>
    <h1>Student Timetable</h1>
  </header>

  <main id="studentContainer">
    <table class="timetable">
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Time</th>
          <th>Day</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for classes in classes %}
        <tr>
          <td>{{ classes.studentname }}</td>
          <td>{{ classes.time }}</td>
          <td>{{ classes.day }}</td>
          <td>
            <form action="{{ url_for('droplesson.dropclasses') }}" method="POST">
              <input type="hidden" name="droptutorname" value="{{ classes.tutorname }}">
              <input type="hidden" name="droptime" value="{{ classes.time }}">
              <input type="hidden" name="dropday" value="{{ classes.day }}">
              <button type="submit" name="dropclass" class="drop-btn">Drop Class</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </main>

  <!-- Back to Student View Button -->
  <div class="back-button">
    <a href="/studentview/">
      <button class="back-btn">Back to Student View</button>
    </a>
  </div>

</body>
</html>
