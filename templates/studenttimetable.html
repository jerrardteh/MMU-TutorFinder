<!DOCTYPE html>
<html>
    <body>
           <main id="studentContainer">
    {% for classes in classes %}
    <div class="card">
        <div class="info">
            <p><strong>{{ classes.subject }}</strong> with <strong>{{ classes.tutorname }}</strong> at <strong> {{ classes.time }}</strong> on <strong> {{ classes.day }}</strong></p>
        </div>
        <form action="{{ url_for('droplesson.dropclasses') }}" method="POST">
            <input type="hidden" name="droptutorname" value="{{ classes.tutorname }}">
            <input type="hidden" name="droptime" value="{{ classes.time }}">
            <input type="hidden" name="dropday" value="{{ classes.day }}">
            <button name="dropclass">Drop Class</button>
        </form>
    </div>
    {% endfor %} 
    </body>
</html>
