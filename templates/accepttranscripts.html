<!DOCTYPE html>
<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            <ul>
            {% for message in messages %}
                    <li>{{ message }}</li>
            {% endfor %}
            </ul>
        </div>
        {% endif %}
    {% endwith %}

    {% for transcripts in transcripts %}
        <p>{{ transcripts.tutorname }}</p>
        <img src="{{ transcripts.transcript }}">
        <form action="{{ url_for('adminview.accepttranscripts') }}" method="post">
            <input type="hidden" name="tutorname" value="{{ transcripts.tutorname }}">
            <input type="radio" id="radioaccept" name="decision" value="accept">
            <label for="radioaccept">Accept</label>
            <input type="radio" id="radiodeny" name="decision" value="deny">
            <label for="radiodeny">Deny</label>
            <button type="submit">Submit</button>
        </form>
    {% endfor %}

    <a href="{{ url_for('adminview.html') }}">
        <button>Back to Admin View</button>
    </a>
</body>
