<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Lesson</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='booklesson.css') }}">
</head>
<body>

  <header>
    <h1>Book a Lesson with {{ tutorname }}</h1>
  </header>

  <main id="lessonContainer">
    <table class="lesson-table">
      <thead>
        <tr>
          <th>Available Lesson Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for lesson in lesson %}
        <tr>
          <td>{{ lesson.daytime }}</td>
          <td>
            <form action="{{ url_for('booklesson.submit') }}" method="POST">
              <input type="hidden" name="tutorname" value="{{ tutorname }}">
              <button type="submit" value="{{ lesson.daytime }}" name="daytime" class="lesson-btn">
                Book Lesson
              </button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </main>

  <!-- Back to Testing Web Button -->
  <div class="back-button">
    <a href="/studentview/">
      <button class="back-btn">Back to Testing Web</button>
    </a>
  </div>

</body>
</html>
